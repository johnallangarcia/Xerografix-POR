<!DOCTYPE html>
<html lang="en">

<meta charset="utf-8">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
:root{--brand:#CB0001;--brand-d:#a30001;--ink:#272838;--bs-primary:#CB0001;--bs-primary-rgb:203,0,1;--bs-link-color:#CB0001;--bs-link-hover-color:#a30001;--bs-link-color-rgb:203,0,1;--bs-body-bg:#fafafb;--bs-border-color:#e6e6ea;--bs-body-color:#272838;--bs-body-color-rgb:39,40,56;--bs-secondary-color:#6c6d7d;--bs-focus-ring-color:rgba(203,0,1,.2);--surface:#fff}
[data-bs-theme=dark]{--bs-body-bg:#191a26;--bs-body-color:#ececf1;--bs-body-color-rgb:236,236,241;--bs-border-color:#34354a;--bs-secondary-color:#9fa0b3;--surface:#272838;--bs-link-color:#ff5a5b;--bs-link-color-rgb:255,90,91}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-feature-settings:"tnum"}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
.top{background:var(--ink);color:#fff;border-bottom:3px solid var(--brand)}
.top h1{font-size:1.15rem;letter-spacing:-.01em}.top .brand{font-weight:800;letter-spacing:.14em;font-size:.72rem;color:#ff8a8b}
.btn-primary{--bs-btn-bg:var(--brand);--bs-btn-border-color:var(--brand);--bs-btn-hover-bg:var(--brand-d);--bs-btn-hover-border-color:var(--brand-d);--bs-btn-active-bg:#850001;--bs-btn-active-border-color:#850001;--bs-btn-disabled-bg:var(--brand);--bs-btn-disabled-border-color:var(--brand);--bs-btn-focus-shadow-rgb:203,0,1}
.btn-outline-primary{--bs-btn-color:var(--brand);--bs-btn-border-color:var(--brand);--bs-btn-hover-bg:var(--brand);--bs-btn-hover-border-color:var(--brand);--bs-btn-active-bg:var(--brand);--bs-btn-active-border-color:var(--brand)}
[data-bs-theme=dark] .btn-outline-primary{--bs-btn-color:#ff6b6c}
.form-control:focus,.form-select:focus{border-color:var(--brand);box-shadow:0 0 0 .2rem rgba(203,0,1,.15)}
.nav-pills{--bs-nav-pills-link-active-bg:var(--ink);--bs-nav-link-color:var(--bs-secondary-color);--bs-nav-link-hover-color:var(--bs-body-color)}
[data-bs-theme=dark] .nav-pills{--bs-nav-pills-link-active-bg:var(--brand)}
.nav-pills .nav-link{white-space:nowrap;font-weight:500;font-size:.9rem;padding:.35rem .8rem}
.nav-pills .nav-link.on{background:var(--ink);color:#fff}[data-bs-theme=dark] .nav-pills .nav-link.on{background:var(--brand)}
.card{background:var(--surface);border-color:var(--bs-border-color);border-radius:.6rem;box-shadow:none}
.sticky-f{position:sticky;top:0;z-index:1020}
.m-card{border-left:3px solid var(--bs-border-color);margin-bottom:.5rem}
.m-card.done{border-left-color:#1f9d55}.m-card.part{border-left-color:#e0a100}.m-card.flag{border-left-color:var(--brand)}.m-card.na{opacity:.5}
.m-card:hover{border-color:rgba(203,0,1,.45);border-left-color:inherit}
.tag{display:inline-block;font-size:.72rem;font-weight:600;padding:.12rem .5rem;border-radius:99px;border:1px solid var(--bs-border-color);color:var(--bs-secondary-color)}
.tag.k{background:var(--ink);color:#fff;border-color:var(--ink)}
.st{font-size:.72rem;font-weight:600;padding:.15rem .55rem;border-radius:99px;background:#eceef1;color:#555}
.st.done{background:#dff4e7;color:#13683a}.st.part{background:#fff1c9;color:#7a5600}.st.flag{background:#fde0e0;color:var(--brand-d)}
[data-bs-theme=dark] .st{background:#34354a;color:#ccc}[data-bs-theme=dark] .st.done{background:#173d2a;color:#7fdca4}[data-bs-theme=dark] .st.part{background:#4a3b0d;color:#ffd666}[data-bs-theme=dark] .st.flag{background:#4d1a1c;color:#ff9a9b}
.up{color:#13683a}.hi{color:#b06a00}.lo{color:var(--brand)}
.pbar{height:4px;background:var(--bs-border-color);border-radius:4px;overflow:hidden}.pbar>div{height:100%;background:var(--brand);transition:width .3s}
.grp{font-size:.8rem;font-weight:600;color:var(--bs-secondary-color);border-bottom:1px solid var(--bs-border-color);padding-bottom:.25rem;margin:1.2rem 0 .6rem}
.stat .v{font-size:1.45rem;font-weight:600;line-height:1.2}
.modal-content{background:var(--surface);border-radius:.8rem}
a[data-more]{cursor:pointer;color:inherit}a[data-more]:hover{color:var(--brand)}
#por{display:none}
.por{font-family:Arial,Helvetica,sans-serif;color:#000;max-width:185mm;margin:0 auto;position:relative}
.por .logo{font-weight:900;font-size:30px;letter-spacing:.32em}.por .co{font-size:19px;font-weight:600;margin-top:2px}.por .ad{font-size:11.5px;line-height:1.35}
.por .no{position:absolute;right:6px;top:34px;color:#CB0001;font:700 34px Georgia,serif;letter-spacing:.02em}
.por h2{font-family:Georgia,"Times New Roman",serif;font-size:30px;text-align:center;margin:20px 0 14px;letter-spacing:.01em}
.por .f{display:flex;align-items:flex-end;gap:6px;margin:7px 0;font-size:14px;font-weight:700}.por .f .l{width:150px}.por .f .v{flex:1;border-bottom:1px solid #000;min-height:22px;padding:0 6px;font-weight:600}
.por table{width:100%;border-collapse:collapse;margin-top:14px;border:2px solid #000}.por td,.por th{border:2px solid #000;padding:7px 8px;font-size:13.5px;font-weight:700;text-align:left}.por td.n{text-align:center;font-weight:600;font-size:17px}.por th.c{text-align:center}
.por .sg{display:flex;gap:30px;margin-top:34px}.por .sg>div{flex:1}.por .sg .ln{border-bottom:1px solid #000;min-height:30px;padding:0 4px;font-weight:600;text-align:center}.por .sg small{display:block;font-size:12px;font-weight:700;text-align:center;margin-top:4px}
.por.sm{max-width:none;width:100%}.por.sm .logo{font-size:5mm;line-height:1.1}.por.sm .co{font-size:3.2mm;margin-top:0;line-height:1.2}.por.sm .ad{font-size:2.15mm;line-height:1.25}.por.sm .no{font-size:4.6mm;top:2.2mm;right:0;line-height:1}.por.sm h2{font-size:4.2mm;margin:2.2mm 0 1.4mm;line-height:1.1}
.por.sm .f{margin:.9mm 0;font-size:2.5mm;gap:.8mm;line-height:1.2}.por.sm .f .l{width:24mm;flex:none}.por.sm .f .v{min-height:3.6mm;padding:0 .8mm;border-bottom-width:.2mm;overflow:hidden;min-width:0;line-height:1.15}
.por.sm table{margin-top:1.8mm;border-width:.3mm}.por.sm td,.por.sm th{border-width:.3mm;padding:.8mm 1mm;font-size:2.3mm;line-height:1.2}.por.sm td.n{font-size:3mm}
.por.sm .sg{margin-top:4mm;gap:3mm}.por.sm .sg .ln{min-height:5mm;font-size:2.4mm;border-bottom-width:.2mm}.por.sm .sg small{font-size:2mm;margin-top:.6mm;line-height:1.2}.por.sm .sg .cc{font-size:2.6mm!important;margin-bottom:.5mm!important}
.pg{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(3,1fr);gap:2mm;width:200mm;height:286mm;break-after:page;page-break-after:always}.pg:last-child{break-after:auto;page-break-after:auto}.pg>div{box-sizing:border-box;border:.2mm dashed #999;padding:1.5mm;overflow:hidden}
#por.measure{display:block;position:absolute;left:-10000px;top:0;width:200mm;visibility:hidden}
@media print{body>*:not(#por){display:none!important}#por{display:block!important}body{background:#fff!important}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
 <div class="container-xl py-3 d-flex flex-wrap align-items-center gap-2">
  <div><div class="brand">XEROGRAFIX</div><h1 class="fw-bold mb-0">FSMA Meter Reading</h1></div>
  <div class="d-flex flex-wrap gap-2 ms-auto">
   <button id="add" class="btn btn-primary fw-semibold">＋ Add machine</button>
   <button id="pall" class="btn btn-outline-light">🖨 Print all</button>
   <button id="csv" class="btn btn-outline-light">Export CSV</button>
   <button id="ref" class="btn btn-outline-light">↻ Refresh</button>
   <button id="con" class="btn btn-outline-light">⚙ Connect</button>
   <button id="thm" class="btn btn-outline-light" aria-label="Toggle theme">◐</button>
  </div>
 </div>
</header>
<main class="container-xl py-3">
 <div class="d-flex flex-wrap align-items-center gap-2 mb-2">
  <div class="input-group" style="width:auto">
   <button class="btn btn-outline-secondary" id="yp" aria-label="Previous year">‹</button>
   <input id="yr" type="number" min="1900" max="9999" class="form-control text-center fw-semibold" style="width:5.5rem" aria-label="Year">
   <button class="btn btn-outline-secondary" id="yn" aria-label="Next year">›</button>
  </div>
  <ul class="nav nav-pills flex-nowrap overflow-auto flex-grow-1" id="pills"></ul>
  <button id="today" class="btn btn-sm btn-outline-secondary">This month</button>
 </div>
 <div id="sub" class="text-body-secondary small mb-3"></div>
 <div class="row row-cols-2 row-cols-md-3 row-cols-xl-6 g-2 mb-2" id="stats"></div>
 <div class="pbar mb-3"><div id="pg" style="width:0"></div></div>
 <div class="card sticky-f mb-3"><div class="card-body p-2"><div class="row g-2">
  <div class="col-12 col-md"><input type="search" id="q" class="form-control" placeholder="Search all records, any month or year…"></div>
  <div class="col-6 col-md-auto"><select id="sc" class="form-select"></select></div>
  <div class="col-6 col-md-auto"><select id="ty" class="form-select"></select></div>
  <div class="col-12 col-md-auto"><div class="btn-group w-100" id="fl"><button class="btn btn-outline-secondary" data-f="all">All</button><button class="btn btn-outline-secondary" data-f="pend">Pending</button><button class="btn btn-outline-secondary" data-f="done">Done</button><button class="btn btn-outline-secondary" data-f="flag">Flagged</button></div></div>
  <div class="col-12 col-md-auto"><select id="by" class="form-select" aria-label="Filter by meter read by"></select></div>
 </div></div></div>
 <div id="list"></div>
</main>

<div class="modal fade" id="mDet" tabindex="-1"><div class="modal-dialog modal-lg modal-dialog-scrollable"><div class="modal-content"></div></div></div>
<div class="modal fade" id="mFrm" tabindex="-1"><div class="modal-dialog modal-lg modal-dialog-scrollable"><div class="modal-content"></div></div></div>
<div class="modal fade" id="mCon" tabindex="-1"><div class="modal-dialog"><div class="modal-content">
 <div class="modal-header"><h2 class="modal-title h5">Connect to Google Sheet</h2><button class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
 <div class="modal-body">
  <p class="small text-body-secondary">Paste the Web app URL from your Apps Script deployment (it ends in <code>/exec</code>). If you set a TOKEN in Code.gs, enter the same one here.</p>
  <label class="form-label small">Web app URL</label><input id="cu" class="form-control mb-2" placeholder="https://script.google.com/macros/s/…/exec">
  <label class="form-label small">Token (optional)</label><input id="ct" class="form-control">
 </div>
 <div class="modal-footer"><button class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button><button id="cs" class="btn btn-primary fw-semibold">Save and load</button></div>
</div></div></div>
<div id="por"></div>
<div class="toast-container position-fixed bottom-0 start-50 translate-middle-x p-3"><div id="toast" class="toast border-0 text-bg-success" role="status"><div class="toast-body" id="tb"></div></div></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
const MO=["January","February","March","April","May","June","July","August","September","October","November","December"],M3=MO.map(m=>m.slice(0,3));
const $=s=>document.querySelector(s),fmt=n=>n==null?"—":n.toLocaleString("en-US");
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const mail=s=>esc(s).replace(/([\w.+-]+@[\w-]+(\.[\w-]+)+)/g,'<a href="mailto:$1">$1</a>');
const modal=id=>bootstrap.Modal.getOrCreateInstance($(id));
/* A period is a whole number: year*12 + month index. No limit on years. */
const pn=s=>{const a=String(s||"").split("-");return a.length<2||isNaN(+a[0])?null:+a[0]*12+(+a[1]-1)};
const ps=n=>Math.floor(n/12)+"-"+String(n%12+1).padStart(2,"0");
const rl=n=>M3[n%12]+" "+Math.floor(n/12),rlf=n=>MO[n%12]+" "+Math.floor(n/12);
const now=new Date(),thisP=now.getFullYear()*12+now.getMonth();
let DATA=[],by=new Map(),cur=0,ui={q:"",sc:"",ty:"",f:"all",by:""},st={p:thisP,by:""},cfg={},extraP=new Set();
try{Object.assign(st,JSON.parse(localStorage.getItem("xgx-ui")||"{}"));cfg=JSON.parse(localStorage.getItem("xgx-gs")||"{}")}catch(e){}
const saveUi=()=>{try{localStorage.setItem("xgx-ui",JSON.stringify(st))}catch(e){}};
/* ---------- Google Apps Script API ---------- */
async function api(a,d){
 if(!cfg.url)throw new Error("Not connected to a Google Sheet");
 let r;
 if(a==="list")r=await fetch(cfg.url+"?a=list"+(cfg.token?"&token="+encodeURIComponent(cfg.token):""));
 else r=await fetch(cfg.url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({a,token:cfg.token||"",...d})});
 const j=await r.json();if(j.error)throw new Error(j.error);return j;
}
function toast(m,bad){const e=$("#toast");e.className="toast border-0 text-bg-"+(bad?"danger":"success");$("#tb").textContent=m;bootstrap.Toast.getOrCreateInstance(e,{delay:bad?4000:1600}).show()}
const blank=()=>({m:[null,null,null],d:"",p:"",b:"",n:""});
const nm=m=>{const o={...m,id:+m.id,rent:m.rent==null||m.rent===""?null:+m.rent,R:{}};["name","addr","model","serial","type","person","phone","sched","contact","first","last"].forEach(k=>o[k]=m[k]==null?"":String(m[k]));return o};
async function load(){
 const j=await api("list");DATA=j.machines.map(nm);by=new Map(DATA.map(x=>[x.id,x]));
 (j.readings||[]).forEach(r=>{const x=by.get(+r.machine_id);if(x)x.R[r.period]={m:r.m||[null,null,null],d:r.d||"",p:r.p||"",b:r.b||"",n:r.n||""}});
}
const pq={};
function push(x,P){const k=x.id+"_"+P;clearTimeout(pq[k]);pq[k]=setTimeout(async()=>{const r=rec(x,P);try{await api("reading_save",{machine_id:x.id,t:ps(P),m:r.m,d:r.d,p:r.p,b:r.b,n:r.n});toast("Saved to Google Sheet")}catch(e){toast("Save failed: "+e.message,1)}},600)}
/* ---------- data helpers ---------- */
const rec=(x,P)=>x.R[ps(P)]||(x.R[ps(P)]=blank());
const val=(x,P,i)=>{const r=x.R[ps(P)];return r&&r.m[i]!=null?r.m[i]:null};
const act=(x,P)=>{const f=pn(x.first),l=x.last?pn(x.last):null;return(f==null||P>=f)&&(l==null||P<=l)};
const sd=x=>parseInt((x.sched||"").replace(/\D/g,""))||99;
const rows=()=>DATA.filter(x=>act(x,st.p)).sort((a,b)=>sd(a)-sd(b)||a.id-b.id);
function info(x,P){
 const p=[0,1,2].map(i=>val(x,P-1,i)),c=[0,1,2].map(i=>val(x,P,i));
 const u=p.map((a,i)=>a!=null&&c[i]!=null?c[i]-a:null),exp=p.map(a=>a!=null),n=exp.filter(Boolean).length,got=exp.filter((e,i)=>e&&c[i]!=null).length,fl=[];
 u.forEach((d,i)=>{if(d==null)return;if(d<0)return fl.push("neg");const a=[];for(let k=1;k<=3;k++){const q=val(x,P-k,i),w=val(x,P-k-1,i);if(q!=null&&w!=null&&q>=w)a.push(q-w)}const av=a.length?a.reduce((y,z)=>y+z,0)/a.length:0;if(av>0&&d>av*3&&d-av>300)fl.push("high")});
 return{p,c,u,fl,st:n==0?"na":got==n?"done":got?"part":"pend"};
}
const LBL={done:"Done",part:"Partial",na:"No meter",pend:"Pending"};
const stat=x=>{if(!act(x,st.p))return'<span class="st">Not active</span>';const i=info(x,st.p);return`<span class="st ${i.st}">${LBL[i.st]}</span>`};
const usage=(d,hi)=>d==null?"":`<span class="${d<0?"lo":hi?"hi":"up"}">${d<0?"":"+"}${fmt(d)}${d<0?" ⚠ lower":hi?" ▲ high":""}</span>`;
const rowUse=x=>{const i=info(x,st.p),mx=Math.max(...i.u.filter(v=>v!=null),0);return i.u.map(d=>usage(d,i.fl.includes("high")&&d>0&&d>=mx))};
const cardCls=x=>{const i=info(x,st.p);return"card m-card "+(!act(x,st.p)?"na":i.fl.length?"flag":i.st)};
function rowHTML(x){
 const i=info(x,st.p),us=rowUse(x);
 return`<div class="${cardCls(x)}" data-id="${x.id}"><div class="card-body py-2 row g-2 align-items-center mx-0">
 <div class="col-lg-4"><a class="fw-semibold text-decoration-none" data-more>${esc(x.name)}</a><div class="small text-body-secondary">${esc(x.addr)||"—"}</div><div class="mt-1 d-flex flex-wrap gap-1 align-items-center"><span class="tag">${esc(x.model)||"—"}</span><span class="tag k">${esc(x.type)||"—"}</span><span class="small text-body-secondary mono">SN ${esc(x.serial)}</span></div></div>
 <div class="col-lg-6"><div class="row g-2">${[0,1,2].map(k=>`<div class="col-4"><label class="form-label small text-body-secondary mb-0">Meter ${k+1} <span class="mono">· ${fmt(i.p[k])}</span></label><input class="form-control form-control-sm mono" inputmode="numeric" data-k="${k}" value="${i.c[k]==null?"":i.c[k]}" placeholder="—" aria-label="Meter ${k+1}, ${esc(x.name)}"><div class="us-w small mono">${us[k]}</div></div>`).join("")}</div></div>
 <div class="col-lg-2 d-flex flex-lg-column gap-2 justify-content-between align-items-lg-end"><span class="stw">${stat(x)}</span><div class="d-flex gap-1"><button class="btn btn-sm btn-outline-primary" data-more>Details</button><button class="btn btn-sm btn-outline-secondary" data-print title="Print proof of reading" aria-label="Print proof of reading">🖨</button></div></div></div></div>`;
}
/* Search text covers every field of the machine plus every reading of every month and year. */
function hay(x){
 const f=pn(x.first),l=x.last?pn(x.last):null;
 return[x.name,x.addr,x.model,x.serial,x.type,x.rent,x.person,x.phone,x.sched,x.contact,x.first,x.last,f!=null?rl(f)+" "+rlf(f):"",l!=null?rl(l)+" "+rlf(l):"",
  ...Object.entries(x.R).flatMap(([k,r])=>{const P=pn(k);return[k,P!=null?rl(P)+" "+rlf(P):"",...r.m,r.d,r.p,r.b,r.n]})].filter(v=>v!=null&&v!=="").join(" ").toLowerCase();
}
function match(x){
 const i=info(x,st.p);
 if(ui.q.trim()){const t=hay(x);if(!ui.q.toLowerCase().split(/\s+/).filter(Boolean).every(w=>t.includes(w)))return false}
 if(ui.by&&!Object.values(x.R).some(r=>(r.b||"").trim()===ui.by))return false;
 if(ui.sc&&x.sched!==ui.sc)return false;if(ui.ty&&x.type!==ui.ty)return false;
 if(ui.f==="pend")return i.st==="pend"||i.st==="part";if(ui.f==="done")return i.st==="done";if(ui.f==="flag")return i.fl.length>0;return true;
}
function renderList(){
 let h="",g=null,n=0;
 const srch=ui.q.trim()!==""||ui.by!=="",src=srch?[...DATA].sort((a,b)=>sd(a)-sd(b)||a.id-b.id):rows();
 src.filter(match).forEach(x=>{if(x.sched!==g){g=x.sched;h+=`<div class="grp">${esc(g||"Unscheduled")}</div>`}h+=rowHTML(x);n++});
 if(srch&&n)h=`<div class="small text-body-secondary mb-1">${n} machine${n>1?"s":""} found${ui.by?` read by ${esc(ui.by)}`:""} across all months and years. Readings shown are for ${rlf(st.p)}.</div>`+h;
 $("#list").innerHTML=n?h:`<div class="text-center text-body-secondary py-5">${DATA.length?(ui.q.trim()?"No records match your search.":"No machines match your filters for "+rlf(st.p)+"."):"No machines yet."}<div class="mt-3"><button class="btn btn-primary" onclick="openForm(null)">＋ Add machine</button></div></div>`;
 stats();
}
function nav(){
 const y=Math.floor(st.p/12);$("#yr").value=y;
 $("#pills").innerHTML=MO.map((m,i)=>`<li class="nav-item"><button class="nav-link${y*12+i===st.p?" on":""}" data-p="${y*12+i}">${m.slice(0,3)}</button></li>`).join("");
 const a=$("#pills .on");if(a)a.scrollIntoView({block:"nearest",inline:"center"});
}
function stats(){
 const rs=rows(),is=rs.map(x=>info(x,st.p)),done=is.filter(i=>i.st==="done").length,pend=is.filter(i=>i.st==="pend"||i.st==="part").length,ok=is.filter(i=>i.st!=="na").length;
 const tot=is.reduce((a,i)=>a+i.u.reduce((b,d)=>b+(d>0?d:0),0),0),rent=rs.reduce((a,x)=>a+(x.rent||0),0);
 $("#stats").innerHTML=[[rs.length,"Machines"],[done,"Fully read"],[pend,"Pending"],[is.filter(i=>i.fl.length).length,"Flagged"],[fmt(tot),"Pages this period"],["₱"+fmt(rent),"Monthly rental"]].map(a=>`<div class="col"><div class="card stat h-100"><div class="card-body p-2 px-3"><div class="v mono">${a[0]}</div><div class="small text-body-secondary">${a[1]}</div></div></div></div>`).join("");
 $("#pg").style.width=(ok?done/ok*100:0)+"%";

}
function paint(id){const x=by.get(id),el=document.querySelector(`.m-card[data-id="${id}"]`);if(!el)return;const us=rowUse(x);el.className=cardCls(x);el.querySelectorAll(".us-w").forEach((w,k)=>w.innerHTML=us[k]);el.querySelector(".stw").innerHTML=stat(x);stats()}
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
$("#list").addEventListener("input",e=>{

 const id=+inp.closest(".m-card").dataset.id,k=+inp.dataset.k,v=inp.value.replace(/\D/g,""),x=by.get(id);inp.value=v;
 const r=rec(x,st.p);r.m[k]=v===""?null:+v;
 if(v!==""){if(!r.d)r.d=today();if(!r.b&&st.by)r.b=st.by}
 paint(id);push(x,st.p);

$("#list").addEventListener("keydown",e=>{if(e.key!=="Enter"||!e.target.matches("input[data-k]"))return;e.preventDefault();const a=[...document.querySelectorAll("#list input[data-k]")],n=a[a.indexOf(e.target)+1];if(n){n.focus();n.select()}});
$("#list").addEventListener("click",e=>{const pb=e.target.closest("[data-print]");if(pb){printPOR(+pb.closest(".m-card").dataset.id,st.p);return}

/* ---------- details modal ---------- */
const mSel=(n,v,empty)=>`<select class="form-select" name="${n}M">${empty?'<option value="">Ongoing</option>':""}${MO.map((m,i)=>`<option value="${i}"${v!=null&&v%12===i?" selected":""}>${m}</option>`).join("")}</select><input type="number" min="1900" max="9999" class="form-control" name="${n}Y" value="${Math.floor((v==null?st.p:v)/12)}" style="max-width:6rem">`;
function openD(id){
 const x=by.get(id),r=rec(x,st.p);cur=id;
 const set=new Set(Object.keys(x.R).filter(k=>x.R[k].m.some(v=>v!=null)).map(pn));set.add(st.p);extraP.forEach(p=>set.add(p));
 const hist=[...set].sort((a,b)=>b-a).map(T=>`<tr data-t="${T}"><td class="align-middle">${rl(T)}</td>${[0,1,2].map(k=>{const a=val(x,T,k);return`<td><input class="form-control form-control-sm mono text-end" inputmode="numeric" data-hk="${k}" value="${a==null?"":a}" aria-label="Meter ${k+1} ${rl(T)}"></td>`}).join("")}<td class="text-nowrap"><button class="btn btn-sm btn-outline-secondary" data-por="${T}" title="Print proof of reading for ${rl(T)}" aria-label="Print ${rl(T)} proof of reading">🖨</button> <button class="btn btn-sm btn-outline-secondary" data-del="${T}" title="Delete this reading" aria-label="Delete ${rl(T)} reading">🗑</button></td></tr>`).join("");
 const kv=[["Model",x.model],["Serial no.",x.serial],["Contract",x.type],["Monthly rental",x.rent?"₱"+fmt(x.rent):"—"],["Schedule",x.sched],["Contact person",x.person],["Contact no.",x.phone],["Email Address",x.contact],["Active",(pn(x.first)!=null?rl(pn(x.first)):"—")+" → "+(x.last?rl(pn(x.last)):"ongoing")]];
 $("#mDet .modal-content").innerHTML=`<div class="modal-header"><div><h2 class="modal-title h5">${esc(x.name)}</h2><div class="small text-body-secondary">${esc(x.addr)}</div></div><div class="ms-auto d-flex gap-2"><button class="btn btn-sm btn-outline-secondary" id="pr">🖨 Print form</button><button class="btn btn-sm btn-outline-primary" id="ed">Edit</button><button class="btn btn-sm btn-outline-secondary" id="rm">Delete</button><button class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div></div>
 <div class="modal-body"><div class="row g-3">${kv.map(a=>`<div class="col-sm-6 col-md-4"><div class="small text-body-secondary">${a[0]}</div>${a[0]==="Email Address"?mail(a[1]||"—"):esc(a[1]||"—")}</div>`).join("")}</div>
 <h3 class="h6 mt-4 mb-2">Reading record · ${rlf(st.p)}</h3>
 <div class="row g-2"><div class="col-md-4"><label class="form-label small">Date meter read</label><input type="date" class="form-control" data-f="d" value="${esc(r.d)}"></div><div class="col-md-4"><label class="form-label small">Proof of reading no.</label><input class="form-control" data-f="p" value="${esc(r.p)}"></div><div class="col-md-4"><label class="form-label small">Meter read by</label><input class="form-control" data-f="b" value="${esc(r.b)}"></div><div class="col-12"><label class="form-label small">Remarks</label><textarea class="form-control" rows="2" data-f="n">${esc(r.n)}</textarea></div></div>
 <h3 class="h6 mt-4 mb-2">Meter history (editable)</h3><div class="table-responsive"><table class="table table-sm align-middle"><thead><tr><th>Reading</th><th class="text-end">Meter 1</th><th class="text-end">Meter 2</th><th class="text-end">Meter 3</th><th></th></tr></thead><tbody>${hist}</tbody></table></div>
 <div class="input-group input-group-sm" style="max-width:26rem" id="ap">${mSel("ap",st.p-1)}<button class="btn btn-outline-primary" id="apb">Add month</button></div></div>`;
 modal("#mDet").show();
}
const D=$("#mDet");
D.addEventListener("input",e=>{const t=e.target,x=by.get(cur);if(!x)return;
 if(t.dataset.f){rec(x,st.p)[t.dataset.f]=t.value;if(t.dataset.f==="b"){st.by=t.value;saveUi()}push(x,st.p)}
 else if(t.dataset.hk!=null){const T=+t.closest("tr").dataset.t,v=t.value.replace(/\D/g,"");t.value=v;rec(x,T).m[+t.dataset.hk]=v===""?null:+v;paint(cur);push(x,T)}});
D.addEventListener("change",e=>{if(e.target.dataset&&e.target.dataset.f==="b"){filters();renderList()}});
D.addEventListener("click",async e=>{const x=by.get(cur);if(!x)return;const t=e.target;
 if(t.id==="pr")printPOR(x.id,st.p);
 else if(t.dataset.por!=null)printPOR(x.id,+t.dataset.por);
 else if(t.id==="ed"){modal("#mDet").hide();openForm(x)}
 else if(t.id==="rm"){if(!confirm(`Delete ${x.name} (SN ${x.serial}) and all of its readings? This cannot be undone.`))return;try{await api("machine_delete",{id:x.id});DATA=DATA.filter(m=>m.id!==x.id);by.delete(x.id);modal("#mDet").hide();filters();renderList();toast("Machine deleted")}catch(er){toast(er.message,1)}}
 else if(t.id==="apb"){const T=+$("#ap [name=apY]").value*12+ +$("#ap [name=apM]").value;if(isNaN(T)||T<0)return;extraP.add(T);openD(x.id)}
 else if(t.dataset.del!=null){const T=+t.dataset.del;if(!confirm(`Delete the ${rl(T)} reading?`))return;try{await api("reading_delete",{machine_id:x.id,t:ps(T)});delete x.R[ps(T)];extraP.delete(T);renderList();openD(x.id);toast("Reading deleted")}catch(er){toast(er.message,1)}}});
/* ---------- add / edit machine ---------- */
const F=[["name","Customer name","col-12"],["addr","Address","col-12"],["model","Model","col-md-4"],["serial","Serial no.","col-md-4"],["type","Type of contract","col-md-4"],["rent","Monthly rental (₱)","col-md-4"],["person","Contact person","col-md-4"],["phone","Contact no.","col-md-4"],["sched","Schedule (e.g. EVERY 18TH)","col-md-6"],["contact","Email Address","col-md-6"]];
const DD=["model","type","sched"];
function dd(n,v,l){
 const vals=[...new Set([...DATA.map(m=>m[n]).filter(Boolean),v].filter(Boolean))].sort((a,b)=>n==="sched"?(parseInt(a.replace(/\D/g,""))||99)-(parseInt(b.replace(/\D/g,""))||99):a.localeCompare(b));
 return`<select class="form-select" name="${n}" data-dd><option value=""${v?"":" selected"}>— None —</option>${vals.map(o=>`<option${o===v?" selected":""}>${esc(o)}</option>`).join("")}<option value="__new__">＋ Add new…</option></select><input class="form-control mt-2 d-none" name="${n}_new" placeholder="Enter new ${l.toLowerCase()}" aria-label="New ${l}">`;
}
function openForm(x){
 const v=x||{first:ps(st.p),last:""};
 $("#mFrm .modal-content").innerHTML=`<form id="mf"><div class="modal-header"><h2 class="modal-title h5">${x?"Edit machine":"Add machine"}</h2><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div><div class="modal-body"><div class="row g-3">${F.map(a=>`<div class="${a[2]}"><label class="form-label small">${a[1]}</label>${DD.includes(a[0])?dd(a[0],v[a[0]],a[1]):`<input class="form-control" name="${a[0]}" ${a[0]==="rent"?'type="number" min="0" step="0.01"':""} ${a[0]==="name"?"required":""} value="${esc(v[a[0]])}">`}</div>`).join("")}
 <div class="col-md-6"><label class="form-label small">Active from</label><div class="input-group">${mSel("first",pn(v.first))}</div></div>
 <div class="col-md-6"><label class="form-label small">Active until (last month)</label><div class="input-group">${mSel("last",v.last?pn(v.last):null,1)}</div></div></div></div>
 <div class="modal-footer"><button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button><button class="btn btn-primary fw-semibold">${x?"Save changes":"Add machine"}</button></div></form>`;
 $("#mf").onchange=e=>{const s=e.target;if(s.dataset.dd!=null){const i=s.parentNode.querySelector(`[name="${s.name}_new"]`);i.classList.toggle("d-none",s.value!=="__new__");if(s.value==="__new__")i.focus()}};
 $("#mf").onsubmit=async e=>{e.preventDefault();const o=Object.fromEntries(new FormData(e.target));o.id=x?x.id:0;
  for(const n of DD){if(o[n]==="__new__"){o[n]=(o[n+"_new"]||"").trim();if(!o[n])return toast("Enter the new "+F.find(a=>a[0]===n)[1].toLowerCase(),1)}delete o[n+"_new"]}
  const f=+o.firstY*12+ +o.firstM,l=o.lastM===""?null:+o.lastY*12+ +o.lastM;
  if(l!=null&&l<f)return toast("The last month must be after the first month",1);
  o.first=ps(f);o.last=l==null?"":ps(l);const b=e.submitter;b.disabled=true;
  try{const m=nm((await api("machine_save",o)).machine);if(x)Object.assign(x,m,{R:x.R});else{DATA.push(m);by.set(m.id,m)}
   modal("#mFrm").hide();if(!act(m,st.p)){st.p=pn(m.first);saveUi();nav()}filters();renderList();toast(x?"Machine updated":"Machine added")}catch(er){toast(er.message,1)}
  b.disabled=false};
 modal("#mFrm").show();
}
/* ---------- Proof of Reading form ---------- */
const fd=s=>{const a=String(s||"").split("-");return a.length===3?(+a[2])+" "+M3[+a[1]-1]+" "+a[0]:s||""};
function porHTML(x,P,cls){
 const r=x.R[ps(P)]||blank(),c=[0,1,2].map(k=>val(x,P,k)),p=[0,1,2].map(k=>val(x,P-1,k)),g=c.map((v,k)=>v!=null&&p[k]!=null?v-p[k]:null),n=v=>v==null?"":v.toLocaleString("en-US");
 const sig=[r.b,fd(r.d)].filter(Boolean).join(" / ");
 return`<div class="por ${cls||""}"><div class="logo">XEROGRAFIX</div><div class="co">Business Products &amp; Services, Inc.</div><div class="ad">Lot Space #3 Manila Avenue, CBD Area, Subic Bay Freeport Zone 2222<br>Tele/ Fax No. (047) 252-5457/250-2043</div><div class="no">${esc(r.p)}</div>
 <h2>PROOF OF READING</h2>
 <div class="f"><span class="l">CUSTOMER NAME</span>:<span class="v">${esc(x.name)}</span></div>
 <div class="f"><span class="l">ADDRESS</span>:<span class="v">${esc(x.addr)}</span></div>
 <div class="f"><span class="l">DATE</span>:<span class="v">${esc(fd(r.d))}</span></div>
 <div class="f"><span class="l">MODEL</span>:<span class="v">${esc(x.model)}</span><span style="margin-left:10px">SERIAL NO.</span>:<span class="v">${esc(x.serial)}</span></div>
 <table><tr><th style="width:31%">METER</th><th class="c">METER 1</th><th class="c">METER 2</th><th class="c">METER 3</th></tr>
 <tr><td>PRESENT READING</td>${c.map(v=>`<td class="n">${n(v)}</td>`).join("")}</tr>
 <tr><td>PREVIOUS READING</td>${p.map(v=>`<td class="n">${n(v)}</td>`).join("")}</tr>
 <tr><td>GROSS COPIES/PRINT</td>${g.map(v=>`<td class="n">${n(v)}</td>`).join("")}</tr></table>
 <div class="sg"><div><div class="cc" style="font-weight:700;font-size:15px;margin-bottom:4px">Certified Correct</div><div class="ln">${esc(sig)}</div><small>XEROGRAFIX Representative<br>Print Name / Signature / Date</small></div>
 <div style="align-self:flex-end"><div class="ln"></div><small>Authorized Customer Representative<br>Print Name / Signature / Date</small></div></div></div>`;
}
/* Auto-fit: shrink any long field to one line, then scale a whole form down if it still overflows its box. */
function fitAll(){
 const root=$("#por");root.classList.add("measure");
 root.querySelectorAll(".pg>div").forEach(c=>{
  c.querySelectorAll(".v").forEach(v=>{const g=getComputedStyle(v);let fs=parseFloat(g.fontSize);const min=fs*.55;while((v.scrollHeight>parseFloat(g.lineHeight)*2+1||v.scrollWidth>v.clientWidth+.5)&&fs>min){fs-=.3;v.style.fontSize=fs+"px"}});
  const cs=getComputedStyle(c),aw=c.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight),ah=c.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom),f=c.firstElementChild,k=Math.min(1,ah/f.offsetHeight);
  if(k<1){f.style.transformOrigin="0 0";f.style.transform="scale("+k+")";f.style.width=aw/k+"px"}
 });
 root.classList.remove("measure");
}
function doPrint(html,size,title,fit){
 $("#por").innerHTML=html;if(fit)fitAll();
 let s=$("#pgs");if(!s){s=document.createElement("style");s.id="pgs";document.head.appendChild(s)}
 s.textContent="@media print{@page{size:"+size+"}}";
 const t=document.title;document.title=title;
 window.addEventListener("afterprint",()=>{document.title=t},{once:true});
 setTimeout(()=>window.print(),80);
}
function printPOR(id,P){const x=by.get(id);doPrint(porHTML(x,P),"A4 portrait;margin:12mm","Proof of Reading - "+x.name+" - "+rl(P))}
/* Print all: every machine in the current results that is active this month, 6 forms per A4 portrait page (2 x 3). */
function printAll(){
 const srch=ui.q.trim()!==""||ui.by!=="",src=srch?[...DATA].sort((a,b)=>sd(a)-sd(b)||a.id-b.id):rows();
 const L=src.filter(match).filter(x=>act(x,st.p)&&info(x,st.p).st!=="na");
 if(!L.length)return toast("No results to print for "+rlf(st.p),1);
 let h="";for(let i=0;i<L.length;i+=6)h+='<div class="pg">'+L.slice(i,i+6).map(x=>"<div>"+porHTML(x,st.p,"sm")+"</div>").join("")+"</div>";
 doPrint(h,"A4 portrait;margin:5mm","Proof of Reading - all - "+rl(st.p),1);
}
/* ---------- export, filters, init ---------- */
function csv(){
 const H=["NO.","CUSTOMER NAME","ADDRESS","MODEL","SERIAL","TYPE OF CONTRACT","MONTHLY RENTAL","CONTACT PERSON","CONTACT NO.","SCHEDULE","PREV METER 1","PREV METER 2","PREV METER 3","CURRENT METER 1","CURRENT METER 2","CURRENT METER 3","USAGE 1","USAGE 2","USAGE 3","DATE METER READ","PROOF OF READING NO.","METER READ BY","REMARKS","EMAIL ADDRESS"],q=v=>'"'+String(v==null?"":v).replace(/"/g,'""')+'"';
 const L=rows().map((x,n)=>{const i=info(x,st.p),en=x.R[ps(st.p)]||{};return[n+1,x.name,x.addr,x.model,x.serial,x.type,x.rent,x.person,x.phone,x.sched,...i.p,...i.c,...i.u,en.d,en.p,en.b,en.n,x.contact].map(q).join(",")});
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+[H.map(q).join(","),...L].join("\r\n")],{type:"text/csv"}));a.download=`XEROGRAFIX-MeterReading-${M3[st.p%12].toUpperCase()}-${Math.floor(st.p/12)}.csv`;a.click();
}
const opt=(a,l)=>`<option value="">${l}</option>`+a.map(v=>`<option>${esc(v)}</option>`).join("");
function filters(){
 $("#sc").innerHTML=opt([...new Set(DATA.map(x=>x.sched).filter(Boolean))].sort((a,b)=>parseInt(a.replace(/\D/g,""))-parseInt(b.replace(/\D/g,""))),"All schedules");
 const rd=[...new Set(DATA.flatMap(x=>Object.values(x.R).map(r=>(r.b||"").trim())).filter(Boolean))].sort((a,b)=>a.localeCompare(b));if(ui.by&&!rd.includes(ui.by))ui.by="";
 $("#by").innerHTML=opt(rd,"All readers");$("#by").value=ui.by;
 $("#ty").innerHTML=opt([...new Set(DATA.map(x=>x.type).filter(Boolean))].sort(),"All contracts");$("#sc").value=ui.sc;$("#ty").value=ui.ty;
}
async function boot(){
 nav();
 if(!cfg.url){$("#list").innerHTML='<div class="text-center text-body-secondary py-5">Connect your Google Sheet to begin.</div>';stats();$("#cu").value="";modal("#mCon").show();return}
 $("#list").innerHTML='<div class="text-center py-5"><div class="spinner-border" style="color:var(--brand)"></div></div>';
 try{await load();filters();renderList()}catch(e){$("#list").innerHTML=`<div class="alert alert-danger">Could not load data: ${esc(e.message)}. Check the Web app URL (⚙ Connect) and that access is set to “Anyone”.</div>`}
}
const go=p=>{if(isNaN(p)||p<0)return;st.p=p;saveUi();nav();renderList()};
$("#pills").onclick=e=>{const b=e.target.closest("button");if(b)go(+b.dataset.p)};
$("#yp").onclick=()=>go(st.p-12);$("#yn").onclick=()=>go(st.p+12);
$("#yr").onchange=e=>{const y=Math.round(+e.target.value);if(y>=1900&&y<=9999)go(y*12+st.p%12);else nav()};
$("#today").onclick=()=>go(thisP);
$("#q").oninput=e=>{ui.q=e.target.value;renderList()};$("#sc").onchange=e=>{ui.sc=e.target.value;renderList()};$("#ty").onchange=e=>{ui.ty=e.target.value;renderList()};
$("#fl").onclick=e=>{const b=e.target.closest("button");if(!b)return;ui.f=b.dataset.f;document.querySelectorAll("#fl button").forEach(c=>c.classList.toggle("active",c===b));renderList()};
$("#fl button").classList.add("active");
$("#by").onchange=e=>{ui.by=e.target.value;renderList()};
$("#add").onclick=()=>openForm(null);$("#csv").onclick=csv;$("#pall").onclick=printAll;$("#ref").onclick=boot;
$("#con").onclick=()=>{$("#cu").value=cfg.url||"";$("#ct").value=cfg.token||"";modal("#mCon").show()};
$("#cs").onclick=()=>{const u=$("#cu").value.trim();if(!/^https:\/\/script\.google\.com\/.+\/exec/.test(u))return toast("Enter the Web app URL ending in /exec",1);cfg={url:u,token:$("#ct").value.trim()};try{localStorage.setItem("xgx-gs",JSON.stringify(cfg))}catch(e){}modal("#mCon").hide();boot()};
$("#thm").onclick=()=>{const h=document.documentElement,d=h.dataset.bsTheme==="dark"?"light":"dark";h.dataset.bsTheme=d;try{localStorage.setItem("xgx-th",d)}catch(e){}};
document.documentElement.dataset.bsTheme=(()=>{try{return localStorage.getItem("xgx-th")}catch(e){}})()||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");
boot();
</script>
